[package]
name = "blockbite-prize"
version = "1.0.0"
description = "BlockBite prize payouts: merkle results, 24h cold-wallet veto, claims from a program-owned USDC vault (Pinocchio)"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "blockbite_prize"

[features]
default = []
no-entrypoint = []

[dependencies]
pinocchio = { version = "=0.11.2", default-features = false, features = ["cpi"] }

[dev-dependencies]
litesvm = "=0.16.0"
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
solana-transaction = "4.1.5"
solana-instruction = "~3.4.0"
solana-address = { version = "~2.6.1", features = ["curve25519"] }
solana-message = "4.2.4"
solana-account = "4.3.0"
solana-clock = "~3.1.1"
sha2 = "0.10"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
